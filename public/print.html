<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复习单 · 打印</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px 16px 40px;
    font: 13px/1.6 "Songti SC", "SimSun", "Microsoft YaHei", serif;
    color: #000;
    background: #f0f0f0;
  }
  .sheet {
    max-width: 200mm;
    margin: 0 auto 16px;
    background: #fff;
    padding: 14mm 12mm;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: 1px; }
  .meta { font-size: 11.5px; color: #555; margin-bottom: 10px; }
  .tip {
    font-size: 11.5px; color: #333; border: 1px solid #bbb;
    padding: 6px 9px; margin-bottom: 12px; line-height: 1.7;
  }
  .day { margin-top: 14px; break-inside: avoid; }
  .day > h2 {
    font-size: 13px; margin: 0 0 7px; padding-bottom: 3px;
    border-bottom: 1.5px solid #000; display: flex; justify-content: space-between;
  }
  .item { margin-bottom: 13px; break-inside: avoid; }
  .item .no { font-size: 11.5px; color: #444; margin-bottom: 2px; }
  .item .stem { font-size: 12.5px; line-height: 1.75; }
  .item .blank { height: 26px; border-bottom: 1px dotted #bbb; margin-top: 5px; }
  .item .blank.short { height: 22px; }
  .chk { display: inline-block; width: 13px; height: 13px; border: 1px solid #000; vertical-align: -2px; margin-right: 3px; }
  .answers { page-break-before: always; }
  .answers .item .no { font-weight: 700; }
  .ans { font-size: 12px; line-height: 1.7; }
  .ans .k { color: #000; font-weight: 700; }
  .katex { font-size: 1em; }
  .toolbar {
    position: sticky; top: 0; z-index: 9;
    display: flex; gap: 8px; justify-content: center;
    padding: 8px; margin: -18px -16px 14px;
    background: #fff; border-bottom: 1px solid #ddd;
  }
  .toolbar button {
    font: inherit; padding: 8px 18px; border: 1px solid #ccc;
    background: #fff; border-radius: 7px; cursor: pointer;
  }
  .toolbar button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; max-width: none; margin: 0; padding: 0; }
    @page { margin: 12mm; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button class="primary" onclick="window.print()">打印 / 存为 PDF</button>
  <button onclick="window.close()">关闭</button>
</div>
<div id="root"><p style="text-align:center;padding:30px">加载中…</p></div>
<script type="module" src="/print.js"></script>
</body>
</html>
